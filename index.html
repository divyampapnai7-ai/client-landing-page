<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex Dental Clinic - Your Smile, Our Priority</title>
    <meta name="description" content="Experience advanced pain-free dentistry, comprehensive cosmetic and restorative transformations, and personalized preventative care at Apex Dental Clinic. Your comfort and long-term oral health are our top priorities.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            color: #333;
        }
        h1, h2, h3, .font-display {
            font-family: 'Playfair Display', serif;
            color: #1a202c;
        }
        .text-primary { color: #0f766e; } /* Teal-700 */
        .bg-primary { background-color: #0f766e; }
        .border-primary { border-color: #0f766e; }
        .text-secondary { color: #14b8a6; } /* Teal-500 */
        .bg-secondary { background-color: #14b8a6; }
        .btn-primary {
            background-color: #0f766e;
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 0.375rem;
            font-weight: 600;
            transition: background-color 0.3s ease;
        }
        .btn-primary:hover {
            background-color: #0d665e;
        }
        .gradient-bg {
            background: linear-gradient(to right, #0f766e, #14b8a6);
        }
        .feature-card {
            background-color: white;
            border-radius: 0.75rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .feature-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
    </style>
</head>
<body class="bg-gray-50 antialiased">

    <!-- Header/Hero Section -->
    <header class="relative bg-gradient-to-r from-teal-700 to-teal-500 text-white py-20 lg:py-28 overflow-hidden">
        <div class="absolute inset-0 z-0 opacity-10">
            <svg class="h-full w-full" fill="none" viewBox="0 0 100 100" preserveAspectRatio="none">
                <defs>
                    <pattern id="pattern-zigzag" x="0" y="0" width="10" height="10" patternUnits="userSpaceOnUse">
                        <path d="M0 0h5v5H0zM5 5h5v5H5z" fill="white"></path>
                    </pattern>
                </defs>
                <rect x="0" y="0" width="100%" height="100%" fill="url(#pattern-zigzag)"></rect>
            </svg>
        </div>
        <nav class="absolute top-0 left-0 right-0 z-20 container mx-auto px-4 py-4 flex justify-between items-center">
            <a href="#" class="text-3xl font-display font-bold">Apex Dental Clinic</a>
            <a href="#contact" class="btn-primary inline-flex items-center">
                Book Appointment
                <svg class="ml-2 -mr-1 w-4 h-4" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg>
            </a>
        </nav>
        <div class="relative z-10 container mx-auto px-4 text-center">
            <h1 class="text-5xl lg:text-6xl font-display font-extrabold leading-tight mb-6">
                Your Healthiest, Most Confident Smile Starts Here.
            </h1>
            <p class="text-xl lg:text-2xl max-w-3xl mx-auto mb-10 opacity-90">
                Experience exceptional dental care with a focus on your comfort, beauty, and long-term well-being.
            </p>
            <a href="#services" class="btn-primary inline-flex items-center text-lg px-8 py-3">
                Explore Our Services
                <svg class="ml-2 -mr-1 w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg>
            </a>
        </div>
    </header>

    <!-- Key Selling Points Section -->
    <section id="services" class="py-16 lg:py-24 bg-gray-50">
        <div class="container mx-auto px-4">
            <h2 class="text-4xl lg:text-5xl font-display font-bold text-center mb-16">
                Why Choose Apex Dental Clinic?
            </h2>
            <div class="grid md:grid-cols-1 lg:grid-cols-3 gap-10 lg:gap-12">

                <!-- KSP 1: Advanced Pain-Free Dentistry & Patient Comfort -->
                <div class="feature-card p-8 flex flex-col items-center text-center">
                    <div class="bg-teal-100 text-primary p-4 rounded-full mb-6">
                        <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.27
